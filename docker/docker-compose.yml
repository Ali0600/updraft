# Run from the repo root:  docker compose -f docker/docker-compose.yml up --build
services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Must be reachable from the device. A physical phone needs this to be
      # the host's LAN address over HTTPS, not localhost.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # No default: the server refuses to start without it.
      PUBLISH_TOKEN: ${PUBLISH_TOKEN:?set PUBLISH_TOKEN in .env (openssl rand -hex 32)}
      CODE_SIGNING_KEY_ID: ${CODE_SIGNING_KEY_ID:-main}
      # Points at the mount below. Leave unset to run without code signing;
      # set it and clients can demand signed updates.
      CODE_SIGNING_PRIVATE_KEY_PATH: ${CODE_SIGNING_PRIVATE_KEY_PATH:-}
    volumes:
      - ota-data:/data
      # Signing keys stay on the host, read-only, never baked into the image.
      # Create them with: updraft keys generate --output ./certs
      - ../certs:/keys:ro
    restart: unless-stopped

volumes:
  ota-data:
