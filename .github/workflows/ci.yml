name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only ever needs to read the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor (pnpm 11 needs >= 22.13; it imports node:sqlite).
        # 24 is the newest line, so a future-version break shows up here rather
        # than on someone's machine.
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Started with `docker run` rather than a `services:` block: service
      # containers cannot pass a command, and minio/minio does nothing without
      # `server /data`. Digest-pinned like every third-party action here.
      - name: Start MinIO
        run: .github/scripts/start-minio.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_ACCESS_KEY_ID: updraft-test-key
          S3_TEST_SECRET_ACCESS_KEY: updraft-test-secret-0123456789

      - name: Build
        run: pnpm build

  e2e:
    name: docker end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Builds the image, publishes a fixture export through the real CLI, and
      # fetches the manifest and every asset over real HTTP. Covers what the
      # in-process suite cannot: the bundle, migrations running from dist/,
      # and the native module actually loading.
      - name: End-to-end against the container
        run: ./scripts/e2e-docker.sh 3000

      - name: Container refuses to start without PUBLISH_TOKEN
        run: |
          docker build -f docker/Dockerfile -t ota-os:ci .
          if docker run --rm -e PUBLIC_URL=http://localhost:3000 ota-os:ci; then
            echo "server booted without PUBLISH_TOKEN — fail-closed config is broken"
            exit 1
          fi

  s3-e2e:
    name: s3 storage and direct delivery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Runs the container against a real MinIO with direct delivery enabled,
      # then fetches the same asset from the bucket and through the proxy and
      # requires them to be identical. The in-process suite drives the driver
      # directly; only this proves the container wires it from real config.
      - name: End-to-end with S3 storage
        run: ./scripts/e2e-s3.sh

  real-export:
    name: publish a real metro export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install example app
        working-directory: example-app
        run: npm install

      # The fixture export is hand-made; this one is Metro's real output, which
      # is the only thing that proves the CLI parses what expo actually writes.
      - name: Publish a real export end to end
        run: ./scripts/e2e-real-export.sh 3000

      - name: Verify the composite action's steps
        run: ./scripts/verify-action-steps.sh 3010

  mutation:
    name: tests actually bite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The harness requires a green baseline, so it needs every dependency
      # the suite needs.
      - name: Start MinIO
        run: .github/scripts/start-minio.sh

      # Breaks each guard in turn and fails if the suite stays green — a test
      # that has never failed proves nothing.
      - name: Verify every guard is covered
        run: pnpm test:bite
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_ACCESS_KEY_ID: updraft-test-key
          S3_TEST_SECRET_ACCESS_KEY: updraft-test-secret-0123456789
